name: Palomar full mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character public candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"Lean","comparator_config_path":"Lean/comparator.json","formalization_metadata_path":"Lean/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
