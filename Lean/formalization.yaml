version: v0.4
project:
  name: Logical consequence and essential incompleteness in recursion categories
  description: >-
    From a recursion category we construct, under additional hypotheses, internal
    first-order theories in its restriction idempotent completion. Among disjoint
    pairs (a,b) of restriction idempotents generating consistent theories, exactly
    the inseparable pairs generate essentially incomplete ones: theories with no
    complete consistent internal extension in their language. Di Paola and Heller
    proved diagonal domains inseparable toward an algebraization of incompleteness
    that never appeared. A comparison theorem for range functors gives conditions
    for diagonal pairs of Turing morphisms to be inseparable; we apply such pairs
    to internal theories of recursion categories for a categorical form of
    Smullyan's criterion: a consistent theory strongly separating a recursively
    inseparable pair has recursively inseparable theorems and refutations. A
    disjoint pair (a,b) specifies two families of propositional atoms. The least
    theory proving the first and refuting the second is T_(a,b). The construction
    is left adjoint to the functor giving theorem and refutation subobjects, so
    translations from T_(a,b) into a theory T correspond to assignments of its
    sentences sending a into theorems and b into refutations. When (a,b) is
    inseparable, every consistent theory receiving such a translation is
    essentially incomplete. Each theory determines a recursion category over its
    theorem object; under further hypotheses, the theory is essentially incomplete
    exactly when its copy in the completion is. Theory extensions induce fully
    faithful functors between these completions, adjoint on both sides to
    pullback. Three examples are Montagna's S_PA (for consistent PA), uniform
    computations on binary representations of a Miller sequence, and one built
    from diagrams of c.e. sets presenting cosheaves on a three-point space. In
    each we prove an internal theory consistent and essentially incomplete.


    The three statements selected for this entry are the inseparability criterion
    for the generated theory, the construction of a complete consistent extension
    from a Boolean assignment, and the existence of an inseparable pair whose
    generated theory is essentially incomplete.
  authors: [Florian Lengyel]
  responsible_maintainers: [Florian Lengyel]
  license: Apache-2.0

