# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: v0.4
project:
  name: Inseparability and essential incompleteness of an internal first-order theory
  description: >-
    Take two disjoint subobjects A and B of an object X in a regular category
    with disjoint pullback-stable finite coproducts. Form the first-order language with
    one nullary predicate for each index in X. Take the predicates indexed by A
    and the negations of those indexed by B as axioms. If the generated theory
    is consistent, every consistent closed internal extension of it is incomplete
    if and only if A and B are inseparable. Inseparability means that no two
    complementary subobjects of X contain A and B respectively. The arithmetic
    diagonal pair gives an example in which the theory is consistent and the
    pair is inseparable.
  authors: [Florian Lengyel]
  responsible_maintainers: [Florian Lengyel]
  license: Apache-2.0

classification:
  arxiv: [math.LO, math.CT]
  msc2020: [03F40, 03D75, 03G30]

sources:
  - title: Logical consequence and essential incompleteness in recursion categories
    authors: [Florian Lengyel]
    type: manuscript
    relationship: formalizes
    id: https://github.com/flengyel/CategoricalEssentialIncompleteness/blob/02bc60e462c437b5502ba784bed7c707f15ab249/manuscript/logical_consequence_and_essential_incompleteness_v66.pdf
    location: Version 66, 18 November 2026, Corollary 4.8 (p. 14) and Lemma 8.9 (p. 50).
    author_endorsement: participated
  - title: There are no minimal essentially undecidable theories
    authors: [Juvenal Murwanashyaka, Fedor Pakhomov, Albert Visser]
    type: paper
    relationship: background
    id: https://doi.org/10.1093/logcom/exad005
    location: Journal of Logic and Computation 34 (2024), 1159–1171, §4.4, p. 1169.
    note: >-
      The authors construct a theory of an equivalence relation from two disjoint
      computably enumerable sets. Their criterion for essential undecidability is
      recursive inseparability of the two sets. Corollary 4.8 concerns internal
      first-order theories generated by nullary predicates in a category.

