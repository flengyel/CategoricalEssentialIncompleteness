    location: Version 100, 26 November 2026. Theorem 4.7 (pp. 21–23, initiality clause p. 22). Corollary 4.8 and its Boolean-assignment construction (p. 23). The existential consequence of Lemma 8.9 (p. 63).
    author_endorsement: participated
  - title: There are no minimal essentially undecidable theories
    authors: [Juvenal Murwanashyaka, Fedor Pakhomov, Albert Visser]
    type: paper
