version: v0.4
project:
  name: Logical consequence and essential incompleteness in recursion categories
  description: >-
    Di Paola and Heller sought an algebraization of generalized incompleteness
    and proved a diagonal inseparability theorem; we supply one. Instead of
    beginning with a theory and representing its computable functions, we
    begin with a recursion category and construct, under additional
    hypotheses, internal first-order theories in its restriction idempotent
    completion. Among disjoint pairs (a,b) of restriction idempotents
    generating consistent theories T_(a,b), exactly the inseparable pairs
    generate essentially incomplete ones: theories with no complete consistent
    internal extension in their language. A comparison theorem for range
    functors gives conditions for diagonal pairs of Turing morphisms to be
    inseparable; we apply such pairs to internal theories for a categorical
    form of Smullyan's criterion: a consistent theory strongly separating a
    recursively inseparable pair has recursively inseparable theorems and
    refutations. For (a,b) on an object X of propositional atoms, a consistent
    T_(a,b) with its atom constructor is initial among consistent theories
    with a sentence assignment on X sending a into theorems and b into
    refutations. Each such assignment extends uniquely to a translation from
    it. The construction is left adjoint to the functor giving theorem and
    refutation subobjects. When (a,b) is inseparable, every consistent theory
    receiving such a translation is essentially incomplete. Each theory
    determines a recursion category over its theorem object; under further
    hypotheses, the theory is essentially incomplete exactly when its copy in
    the completion is. Examples are Montagna's S_PA (for consistent PA),
    uniform computations on binary representations of a Miller sequence, and
    one built from diagrams of c.e. sets presenting cosheaves on a three-point
    space. In each we prove an internal theory consistent and essentially
    incomplete.


    The three statements selected for this entry are the inseparability criterion
    for the generated theory, the construction of a complete consistent extension
    from a Boolean assignment, and the existence of an inseparable pair whose
    generated theory is essentially incomplete.
  authors: [Florian Lengyel]
  responsible_maintainers: [Florian Lengyel]
  license: Apache-2.0

