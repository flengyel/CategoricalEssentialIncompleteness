status:
  scope: >-
    Corollary 4.8 assumes a disjoint pair with consistent generated theory.
    Its proof constructs a complete extension from a Boolean assignment.
    The third theorem asserts that some nullary first-order calculus has an
    inseparable pair of subobjects whose signed theory is essentially incomplete.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]

automation:
  methods:
    - method: agent
      models: []
      framework: OpenAI Codex and ChatGPT
      tool_setup: >-
        Codex developed Lean proofs and statement checks under the author's
        direction. ChatGPT assisted with the mathematical development, literature
        comparisons, manuscript revisions, and comparisons of the printed and
        formal statements.
  notes: >-
    Florian Lengyel specified the mathematical questions, corrected the
    constructions and the scope of claims, and directed the formalization
    and its review.

fidelity:
  divergences: >-
    Corollary 4.8 is stated for restriction idempotents. The Lean theorem uses
    subobjects. In a split restriction category where each monomorphism of the
    total category has a partial inverse, the order isomorphism between the two
    posets preserves inseparability. ManuscriptChecks.essentiallyIncomplete_iff_inseparable_domains
    applies the subobject theorem in the total category and transports it along
    this isomorphism. CEIPalomar.IsNullaryCalculus specifies the nullary syntax
    and deduction data. ManuscriptChecks.isNullaryCalculus_of_data proves this
    hypothesis for each presentation of Theorem 4.7.

review:
  status: agent-reviewed
  reviewers: [OpenAI Codex and ChatGPT]
  notes: >-
    The manuscript guide covers 77 numbered results. Comparator checks three
    theorems and the definition IsNullaryCalculus. The axiom and placeholder
    counts under status refer to the Solution. Private run 44869789666 checked
    commit a65aeb4d5aae48ef9d71bd3352f8935e7612e434.

alignment:
  namespace: CEIPalomar
  statements:
    - source: Corollary 4.8 of manuscript v70 (p. 16), subobject formulation
      lean: CEIPalomar.essential_incomplete_iff_inseparable
      module: CEIPalomar.Solution
      note: CEIPalomar.ManuscriptChecks.essentiallyIncomplete_iff_inseparable_domains derives the restriction-idempotent equivalence from this declaration.
    - source: Proof of Corollary 4.8 of manuscript v70 (p. 16), Boolean assignment
      lean: CEIPalomar.boolean_assignment
      module: CEIPalomar.Solution
      note: The closed, consistent, complete theory depends only on the assignment. It contains the signed theory of each pair assigned true on the first subobject and false on the second.
    - source: Existential consequence of Lemma 8.9 of manuscript v70 (p. 52)
      lean: CEIPalomar.exists_inseparable_example
      module: CEIPalomar.Solution
      note: The category, the variable and index objects, the calculus, and the two subobjects are existentially quantified.
