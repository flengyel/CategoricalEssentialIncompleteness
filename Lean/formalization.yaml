# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: v0.4
project:
  name: Logical consequence and essential incompleteness in recursion categories
  description: >-
    Let X index the nullary predicates of an internal first-order calculus in a
    regular category with disjoint, pullback-stable finite coproducts. Assume the
    parameter-stable syntax and initial derivation algebras of Theorem 4.7. For
    subobjects A and B of X, let T(A,B) be the theory generated by the atoms
    indexed by A and the negations of the atoms indexed by B.

    A consistent theory is essentially incomplete if every consistent closed
    internal extension in the same language is incomplete. Suppose A and B are
    disjoint and T(A,B) is consistent. Then T(A,B) is essentially incomplete if
    and only if no complementary subobjects C and D of X satisfy A ≤ C and B ≤ D.

    Each Boolean assignment to the atoms gives a closed, consistent, complete
    theory U. Whenever the assignment is true on A and false on B, U contains
    T(A,B). There is a calculus of this kind with an inseparable pair of
    subobjects A and B for which T(A,B) is essentially incomplete.
  authors: [Florian Lengyel]
  responsible_maintainers: [Florian Lengyel]
  license: Apache-2.0

classification:
  arxiv: [math.LO, math.CT]
  msc2020: [03F40, 03D75, 03G30]

sources:
  - title: Logical consequence and essential incompleteness in recursion categories
    authors: [Florian Lengyel]
    type: manuscript
    relationship: formalizes
    id: https://github.com/flengyel/CategoricalEssentialIncompleteness/blob/cei-v70-palomar-r2/manuscript/logical_consequence_and_essential_incompleteness_v70.pdf
    location: Version 70, 21 November 2026, Theorem 4.7 and Corollary 4.8 (p. 16), and the existential consequence of Lemma 8.9 (p. 52).
    author_endorsement: participated
  - title: There are no minimal essentially undecidable theories
    authors: [Juvenal Murwanashyaka, Fedor Pakhomov, Albert Visser]
    type: paper
    relationship: background
    id: https://doi.org/10.1093/logcom/exad005
    location: Journal of Logic and Computation 34 (2024), 1159–1171, §4.4, p. 1169.
    note: >-
      The authors construct a theory of an equivalence relation from two disjoint
      computably enumerable sets. Their criterion for essential undecidability is
      recursive inseparability of the two sets. Corollary 4.8 concerns internal
      first-order theories generated by nullary predicates in a category.

