status:
  scope: >-
    The general equivalence assumes internal first-order syntax with the
    indicated nullary predicates, the initial derivation algebras for axiom
    subobjects, disjointness of the pair, and consistency of the generated
    theory. A Boolean assignment to the atomic predicates gives a closed,
    consistent, complete theory extending every set of signed axioms that it
    satisfies. The existence assertion supplies a category, a calculus and a pair
    satisfying these hypotheses for which both sides of the equivalence hold.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]

automation:
  methods:
    - method: agent
      models: []
      framework: OpenAI Codex and ChatGPT
      tool_setup: >-
        Codex developed Lean proofs and statement checks under the author's
        direction. ChatGPT assisted with the mathematical development, literature
        comparisons, manuscript revisions, and comparisons of the printed and
        formal statements.
  notes: >-
    Florian Lengyel specified the mathematical questions, corrected the
    constructions and the scope of claims, and directed the formalization
    and its review.

fidelity:
  divergences: >-
    The compared equivalence is the subobject form of Corollary 4.8. To obtain
    its printed restriction-idempotent formulation, the manuscript passes to
    the total category of a split restriction category in which each total
    monomorphism has a partial inverse. The substantive Lean development proves
    the resulting order isomorphism and its preservation of inseparability.
    The comparison uses subobjects throughout. Its named definition
    CEIPalomar.IsNullaryCalculus identifies the displayed syntax and deduction
    data with those of the manuscript's nullary first-order calculus. The
    Solution supplies this definition. Extensions range over all
    consistent closed internal theories in the same language. A theory is
    complete when its theorem and refutation subobjects cover the sentence
    object. The concrete existential statement records the consequence of
    Lemma 8.9 that such an inseparable example exists. The Solution uses the
    predicate category for Peano arithmetic to furnish its witness.

review:
  status: agent-reviewed
  reviewers: [OpenAI Codex and ChatGPT]
  notes: >-
    The author-side reviews and the statement-to-proof correspondence are recorded
    in docs/reviews/ and FORMALIZATION_STATUS_V66.md. The underlying proof sources
    match those of the full v62 Lean replay. The v66 record reports targeted
    statement checks and both transitive axiom audits.

alignment:
  namespace: CEIPalomar
  statements:
    - source: Corollary 4.8 of manuscript v66, subobject formulation
      lean: CEIPalomar.essential_incomplete_iff_inseparable
      module: CEIPalomar.Solution
      note: The native equivalence is SignedFirstOrder.essential_incomplete_iff_subobject_inseparable in the CategoricalEssentialIncompleteness.V46 namespace.
    - source: Proof of Corollary 4.8 of manuscript v66, Boolean assignment
      lean: CEIPalomar.boolean_assignment
      module: CEIPalomar.Solution
    - source: Lemma 8.9 of manuscript v66, existence of an inseparable instance
      lean: CEIPalomar.exists_inseparable_example
      module: CEIPalomar.Solution
